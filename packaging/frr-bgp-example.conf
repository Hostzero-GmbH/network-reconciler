! FRR BGP configuration for network-reconciler
!
! network-reconciler adds each locally-running VM's external IP to the loopback
! interface as a /32, and removes it when the VM leaves. FRR turns those into BGP
! announcements via `redistribute connected`, so the upstream always learns which node
! currently hosts a VM. The service never talks to FRR — `ip addr add/del` is the whole
! interface.
!
! Written against an iBGP topology where every PVE node and the upstream router share
! one AS. Adjust the AS number, router-id and neighbour address to match yours.
!
! Apply on EVERY node that can host a VM. A node missing `redistribute connected`
! silently announces nothing, and any VM migrated there becomes unreachable — with no
! error anywhere, because the reconciler's own logs only report the loopback address
! being added.

frr version 10.4.1
frr defaults datacenter
hostname pve01
log syslog informational
service integrated-vtysh-config
!
router bgp 65050
 ! Keep this explicit and per-node. Do not omit it to make the files identical across
 ! nodes: FRR would auto-select a router-id from the highest interface address, and
 ! this node's loopback carries VM /32s that appear and disappear with migrations —
 ! the router-id would churn and reset BGP sessions.
 bgp router-id 192.0.2.10
 no bgp default ipv4-unicast
 coalesce-time 1000
 neighbor BGP peer-group
 neighbor BGP remote-as 65050
 neighbor BGP bfd
 neighbor 192.0.2.1 peer-group BGP
 !
 address-family ipv4 unicast
  neighbor BGP activate
  neighbor BGP soft-reconfiguration inbound
  redistribute connected
 exit-address-family
exit
!
line vty
!

! ── Applying changes ──────────────────────────────────────────────────────────
!
! Editing this file changes NOTHING until FRR loads it, and the running config can
! silently differ from the file for months. Check both before trusting either:
!
!   systemctl show -p ActiveEnterTimestamp frr     # when FRR last loaded config
!   stat -c '%y %n' /etc/frr/frr.conf              # when the file last changed
!
! To apply:
!
!   /usr/lib/frr/frr-reload.py --test /etc/frr/frr.conf   # dry run, prints the diff
!   systemctl reload frr
!
! Prefer `reload` over `restart`. A restart drops the BGP sessions, which withdraws
! every VM /32 this node advertises and causes a brief outage for VMs running on it.
!
! Verify the RUNNING config, which is what actually matters:
!
!   vtysh -c "show running-config" | grep redistribute
!
! ── Recommended on the upstream router ────────────────────────────────────────
!
! `frr defaults datacenter` enables iBGP multipath. That is actively harmful for these
! /32s: a VM lives on exactly one node, so ECMP can only ever split traffic between a
! node that has the VM and one that does not. If two nodes ever advertise the same /32
! — a stale advertisement, a bug, a crashed service — multipath turns a survivable
! wrong-best-path into a hard outage. On the upstream:
!
!   router bgp 65050
!    address-family ipv4 unicast
!     maximum-paths ibgp 1
!    exit-address-family
!
! Diagnose a suspected stale advertisement with:
!
!   vtysh -c "show ip bgp <ext-ip>/32"     # more than one path is always a bug here
!   ip route get <ext-ip>                  # which node is traffic actually going to
!
! ── Optional: restrict what each node announces ────────────────────────────────
!
! NOT required for VM reachability or migration — this is separate hygiene, and it
! narrows announcements, so treat it as its own change with its own testing.
!
! A bare `redistribute connected` announces every connected route on the node, not just
! the VM /32s. On the nodes here that includes vmbr0's 192.0.2.0/24 and mgmt's
! 10.10.10.0/24. If several nodes carry the same private range (a per-node mgmt network
! using the same address on each, for instance), every one of them announces it and the
! upstream ends up load-balancing across all of them.
!
! To announce only host routes:
!
!   ip prefix-list NR-HOST32 seq 5 permit 0.0.0.0/0 ge 32 le 32
!   !
!   route-map NR-ACTIVE permit 10
!    match ip address prefix-list NR-HOST32
!   exit
!   route-map NR-ACTIVE deny 99
!   exit
!   !
!   router bgp 65050
!    address-family ipv4 unicast
!     redistribute connected route-map NR-ACTIVE
!    exit-address-family
!
! Before applying, confirm nothing depends on the wider prefixes being learned via BGP
! from the nodes — on the upstream, `show ip route <prefix>` should report them as
! `connected`, not `bgp`. FRR also does not reliably re-apply a changed route-map to
! already-redistributed routes, so follow up with:
!
!   vtysh -c "clear bgp ipv4 unicast * soft"
